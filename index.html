<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Clone | Karan Kandalkar</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo">

                <i class="fa-brands fa-spotify"></i>

                <span>Spotify</span>

            </div>


            <ul class="menu">

                <li>

                    <a href="#" id="home-link">

                        <i class="fa-solid fa-house"></i>

                        <span>Home</span>

                    </a>

                </li>


                <li>

                    <a href="#" id="search-link">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <span>Search</span>

                    </a>

                </li>

            </ul>


            <div class="library">

                <h3>Your Library</h3>

                <button id="create-playlist-btn">

                    Create Playlist

                </button>

            </div>

        </aside>


        <!-- ================= MAIN ================= -->

        <main class="main-content">

            <button
                class="mobile-menu-btn"
                id="mobile-menu-btn">

                <i class="fa-solid fa-bars"></i>

            </button>


            <header class="topbar">

                <div class="nav-buttons">

                    <button id="back-button">

                        <i class="fa-solid fa-chevron-left"></i>

                    </button>


                    <button id="forward-button">

                        <i class="fa-solid fa-chevron-right"></i>

                    </button>

                </div>


                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search playlist...">

                </div>


                <button class="login-btn">

                    Login

                </button>

            </header>


            <!-- ================= PLAYLIST ================= -->

            <section class="playlist-section">

                <h2>Made For You</h2>

                <div
                    class="playlist-container"
                    id="playlist-container">

                </div>

            </section>

        </main>

    </div>


    <!-- ================= LOGIN MODAL ================= -->

    <div
        class="login-modal"
        id="login-modal">

        <div class="login-box">

            <button
                class="close-login"
                id="close-login">

                <i class="fa-solid fa-xmark"></i>

            </button>


            <i class="fa-brands fa-spotify login-logo"></i>


            <h2>
                Log in to Spotify
            </h2>


            <form id="login-form">

                <input
                    type="email"
                    id="login-email"
                    placeholder="Email"
                    required>


                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required>


                <button type="submit">

                    Log In

                </button>

            </form>

        </div>

    </div>


    <!-- ================= MUSIC PLAYER ================= -->

    <footer class="player">

        <audio id="audio-player"></audio>


        <!-- Song Information -->

        <div class="song-info">

            <img
                src="assets/images/playlist1.jpg"
                alt="Currently playing song">


            <div>

                <h5>
                    Select a playlist
                </h5>

                <p>
                    No song selected
                </p>

            </div>


            <button
                class="like-btn"
                id="like-btn"
                title="Add to favorites">

                <i class="fa-regular fa-heart"></i>

            </button>

        </div>


        <!-- Controls -->

        <div class="controls">

            <div class="control-buttons">

                <i
                    class="fa-solid fa-backward-step previous-btn"
                    title="Previous">
                </i>


                <i
                    class="fa-solid fa-circle-play play-icon"
                    title="Play">
                </i>


                <i
                    class="fa-solid fa-forward-step next-btn"
                    title="Next">
                </i>

            </div>


            <!-- Progress -->

            <div class="progress-container">

                <span id="current-time">
                    0:00
                </span>


                <input
                    type="range"
                    id="progress-bar"
                    value="0"
                    min="0"
                    max="100">


                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- Volume -->

        <div class="volume">

            <i
                class="fa-solid fa-volume-high"
                id="volume-icon"
                title="Mute">
            </i>


            <input
                type="range"
                id="volume-control"
                min="0"
                max="1"
                step="0.01"
                value="1">

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
